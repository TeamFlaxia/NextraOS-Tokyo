# NextraOS Calamares Configuration
# Overrides Debian defaults for NextraOS installer
---

modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
dont-chroot: false
prompt-install: false

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - packagechooserq
      - partition
      - users
      - summary

  - exec:
      - partition
      - mount
      - unpackfs
      - luksbootkeyfile
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader-config
      - grubcfg
      - bootloader
      - packages
      - nextraos-postinstall
      - plymouthcfg
      - initramfscfg
      - initramfs
      - umount

  - show:
      - finished

branding: nextraos

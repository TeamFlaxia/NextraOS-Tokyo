# Rounded desktop with niri spatial tiling.
[theme]
source = "custom"
custom_palette = "Flow"
mode = "light"
shell_mode = "follow"
[theme.templates]
enable_builtin_templates = false
enable_community_templates = false
[shell]
telemetry_enabled = false
external_ip_enabled = false
screen_time_enabled = false
polkit_agent = false
shared_gl_context = false
font_family = "Inter"
date_format = "%m月%d日"
corner_radius_scale = 1.0
button_borders = false
card_borders = false
popup_borders = false
setup_wizard_enabled = false
settings_show_advanced = false
[shell.animation]
speed = 1.15
[shell.panel]
transparency_mode = "solid"
borders = false
launcher_placement = "floating"
launcher_position = "bottom_left"
open_near_click_launcher = false
control_center_placement = "floating"
control_center_position = "bottom_right"
session_placement = "floating"
session_position = "bottom_left"
floating_offset = 12
shadow = true
[shell.launcher]
fetch_exchange_rates = false
compact = true
categories = false
show_app_origin_indicator = false
show_icons = true
sort_by_usage = true
[shell.window_switcher]
mru = true
style = "compact"
show_app_icon = true
show_count = false
[bar.default]
enabled = false

[widget.active_window]
display = "icon_and_text"
title_scroll = "on_hover"
max_length = 420.0
min_length = 60.0
icon_size = 14.0
[widget.clock]
format = "{:%m月%d日  %H:%M}"
[widget.notifications]
hide_when_no_unread = false
[dock]
enabled = false
position = "bottom"
icon_size = 48
background_opacity = 0.91
radius = 20
radius_top_left = 20
radius_top_right = 20
radius_bottom_left = 20
radius_bottom_right = 20
concave_edge_corners = false
margin_edge = 12
cross_axis_padding = 10
main_axis_padding = 16
item_spacing = 8
magnification = true
magnification_scale = 1.3
show_dots = true
show_instance_count = false
inactive_opacity = 1.0
inactive_scale = 1.0
reserve_space = true
shadow = true
pinned = ["org.gnome.Nautilus", "firefox-esr", "org.kde.kate", "org.wezfurlong.wezterm", "dev.noctalia.Noctalia"]
[notification]
width = 360
max_visible = 3
background_opacity = 0.98
border = false
offset_y = 12
offset_x = 16
[osd]
position = "bottom_center"
background_opacity = 0.96
border = false
offset_y = 112
[wallpaper]
transition = ["fade"]
transition_duration = 500.0
[wallpaper.default]
path = "@HOME@/.local/share/wallpapers/flow.png"
[weather]
enabled = false

[widget.launcher]
glyph = "layout-grid"
[widget.launcher.actions]
left = "panel-toggle local/desktop-menu:menu"
right = "settings-open"
[widget.spotlight]
type = "launcher"
glyph = "search"

[widget.workspaces]
style = "minimal"
occupied_color = "on_surface_variant"
empty_color = "on_surface_variant"
[widget.network]
show_label = false
[widget.volume]
show_label = false

[widget.control-center]
glyph = "adjustments-horizontal"
[hooks]
theme_mode_changed = ["@HOME@/.local/bin/flow-theme-sync"]

[desktop_widgets]
enabled = false
[lockscreen]
transition = ["fade"]
transition_duration = 450.0
blur_intensity = 0.35
tint_intensity = 0.18
# Use upstream lockscreen placement on every output.
[control_center]
width = 520
show_shortcut_labels = false

[widget.desktop-search]
type = "local/desktop-menu:search"

[bar.taskbar]
position = "bottom"
thickness = 48
margin_ends = 0
margin_edge = 0
padding = 12
widget_spacing = 12
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = false
background_opacity = 0.96
shadow = false
start = ["desktop-search", "windows-taskbar"]
center = []
end = ["tray", "notifications", "network", "volume", "control-center", "desktop-settings", "clock"]

[widget.windows-taskbar]
type = "taskbar"
pinned = []
show_window_title = false
show_active_indicator = true
active_indicator_color = "primary"
active_opacity = 1.0
inactive_opacity = 1.0
pinned_opacity = 1.0
icon_scale = 2.0
item_spacing = 8.0
only_active_workspace = false
group_by_workspace = false

[widget.desktop-settings]
type = "launcher"
glyph = "settings"
[widget.desktop-settings.actions]
left = "settings-open"
right = "panel-toggle control-center"
